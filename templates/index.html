{% extends "base.html" %}

{% block content %}

<h2>Estado do dispositivo</h2>
<p>Estado atual: <strong>{{ device_state }}</strong></p>

<h2>Controle</h2>

<form method="POST" action="/cmd">
    <input type="hidden" name="command" value="ON" />
    <button type="submit">Ligar</button>
</form>

<form method="POST" action="/cmd">
    <input type="hidden" name="command" value="OFF" />
    <button type="submit">Desligar</button>
</form>

<h2>Informações do broker</h2>
<p>IP: {{ broker_ip }}</p>
<p>Porta: 1883</p>
<p>Tópico de comando: senai/grupo1/dispositivo/cmd</p>
<p>Tópico de status: senai/grupo1/dispositivo/status</p>

{% endblock %}
